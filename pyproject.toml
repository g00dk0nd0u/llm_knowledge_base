[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-knowledge-base-pdf-pipeline"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.setuptools.package-data]
"tools.query_core" = ["schema.sql"]
