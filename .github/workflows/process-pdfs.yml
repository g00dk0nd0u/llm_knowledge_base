name: Process PDFs

on:
  push:
    branches: [main]
    paths:
      - "projects/**/source/**/*.pdf"
      - "tools/pdf_pipeline/**"
      - "schema/**"
      - "pyproject.toml"
      - ".github/workflows/process-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-pipeline-main
  cancel-in-progress: false

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Test
        run: python -m pytest
      - name: Process source PDFs
        run: python -m tools.pdf_pipeline process --all
      - name: Commit generated knowledge when changed
        shell: bash
        run: |
          if git diff --quiet -- projects; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects
          git commit -m "Update generated PDF knowledge"
          git push origin HEAD:main
