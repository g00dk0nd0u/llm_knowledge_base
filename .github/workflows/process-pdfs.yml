name: Process PDFs

on:
  pull_request:
    paths:
      - "projects/**/source/**/*.pdf"
      - "tools/pdf_pipeline/**"
      - "tools/query_core/**"
      - "tools/revit_exporter/**"
      - "revit_exporter/**"
      - "tests/**"
      - "schema/**"
      - "pyproject.toml"
      - ".github/workflows/process-pdfs.yml"
  push:
    branches: [main]
    paths:
      - "projects/**/source/**/*.pdf"
      - "tools/pdf_pipeline/**"
      - "tools/query_core/**"
      - "tools/revit_exporter/**"
      - "revit_exporter/**"
      - "tests/**"
      - "schema/**"
      - "pyproject.toml"
      - ".github/workflows/process-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-pipeline-main
  cancel-in-progress: false

jobs:
  windows-query-runtime:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Standard-library-only Query Core smoke
        run: python -S -m tests.stdlib_runtime_smoke

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Test
        run: python -m pytest
      - name: Static checks
        run: |
          python -m compileall -q tools tests
          git diff --check
      - name: Build pure exporter core
        run: |
          dotnet build revit_exporter/src/LlmKnowledgeBase.Revit.Core/LlmKnowledgeBase.Revit.Core.csproj --framework net8.0
          dotnet build revit_exporter/src/LlmKnowledgeBase.Revit.Core/LlmKnowledgeBase.Revit.Core.csproj --framework net10.0
      - name: Test pure exporter contract
        run: dotnet test revit_exporter/tests/LlmKnowledgeBase.Revit.Core.Tests/LlmKnowledgeBase.Revit.Core.Tests.csproj

  process-and-commit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [validate, windows-query-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Process source PDFs
        run: python -m tools.pdf_pipeline process --all
      - name: Commit generated knowledge when changed
        shell: bash
        run: |
          git add -A -- projects
          if git diff --cached --quiet -- projects; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated PDF knowledge"
          git push origin HEAD:main
